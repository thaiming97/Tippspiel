# Konfiguration für Firebase App Hosting (https://firebase.google.com/docs/app-hosting)
# Wird beim Deploy automatisch gelesen.

runConfig:
  minInstances: 0
  maxInstances: 2

# Umgebungsvariablen & Secrets für die laufende App.
# - `value`  : unkritische Klartext-Werte
# - `secret` : Verweis auf einen Eintrag im Cloud Secret Manager
#              (anlegen mit: firebase apphosting:secrets:set <NAME>)
#
# Hinweis: Für Firestore werden hier KEINE Service-Account-Daten gesetzt.
# Auf App Hosting läuft die App automatisch mit einem Google-Service-Account
# (Application Default Credentials). Falls die App keine Firestore-Rechte hat,
# dem App-Hosting-Dienstkonto die Rolle „Cloud Datastore User" geben.
env:
  - variable: AUTH_SECRET
    secret: AUTH_SECRET
    availability:
      - RUNTIME

  - variable: FIREBASE_PROJECT_ID
    value: tippspiel-vorserie
    availability:
      - RUNTIME
