# Konfiguration für Firebase App Hosting (https://firebase.google.com/docs/app-hosting)
# Wird beim Deploy automatisch gelesen.

runConfig:
  minInstances: 0
  maxInstances: 2

# Umgebungsvariablen & Secrets für die laufende App.
# - `value`  : unkritische Klartext-Werte
# - `secret` : Verweis auf einen Eintrag im Cloud Secret Manager
#              (anlegen mit: firebase apphosting:secrets:set <NAME>)
env:
  - variable: AUTH_SECRET
    secret: AUTH_SECRET
    availability:
      - RUNTIME

  # Projekt-ID deines Firebase-Projekts hier eintragen:
  - variable: FIREBASE_PROJECT_ID
    value: tippspiel-vorserie
    availability:
      - RUNTIME

  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
    availability:
      - RUNTIME

  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
    availability:
      - RUNTIME

  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME

  - variable: FOOTBALL_DATA_API_TOKEN
    secret: FOOTBALL_DATA_API_TOKEN
    availability:
      - RUNTIME

  - variable: FOOTBALL_DATA_COMPETITION
    value: WC
    availability:
      - RUNTIME
